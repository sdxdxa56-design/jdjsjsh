name: ZeroHunter Autonomous Agent
on:
  issues:
    types: [opened]
permissions:
  issues: write
  contents: read
jobs:
  run-agent:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Cache Ollama Models
        uses: actions/cache@v3
        with:
          path: ~/.ollama
          key: ollama-qwen-7b-v1
      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Start Ollama and Pull Model (7B)
        run: |
          ollama serve &
          sleep 5
          ollama pull qwen2.5-coder:7b
      - name: Install Security Arsenal
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm nmap curl jq python3 gobuster dirb golang-go
          go install -v github.com/projectdiscovery/nuclei/v3/cmd/nuclei@latest
          go install -v github.com/projectdiscovery/ffuf@latest
          go install -v github.com/projectdiscovery/subfinder/v2/cmd/subfinder@latest
      - name: Run Autonomous Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
          PATH: ${{ github.workspace }}/go/bin:/usr/local/go/bin:$PATH
        run: python3 agent.py
