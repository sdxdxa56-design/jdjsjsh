name: ZeroHunter Fast Agent

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      target_prompt:
        description: 'Target repo URL or code audit objective'
        required: true
        type: string

permissions:
  issues: write
  contents: read
  packages: read

jobs:
  run-agent:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sdxdxa56-design/jdjsjsh/zerohunter:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Cache Hugging Face GGUF Model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-gguf-3B-q4_k_m

      - name: Run ZeroHunter Agent Loop
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number || '0' }}
          ISSUE_BODY: ${{ github.event.inputs.target_prompt || github.event.issue.body }}
          REPO: ${{ github.repository }}
          ZEROHUNTER_HF_REPO: "sdxdxa56/zerohunter-qwen-gguf"
          ZEROHUNTER_GGUF_FILE: "zerohunter-3b-q4_k_m.gguf"
          FUZZ_TIMEOUT: "90"
        run: python3 agent.py

      - name: Upload Crashes and Audit Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zerohunter-artifacts-${{ github.run_id }}
          path: |
            crashes/
            reports/
          if-no-files-found: ignore
