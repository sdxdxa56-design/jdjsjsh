name: ZeroHunter Fast Agent
on:
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read
  packages: read

jobs:
  run-agent:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/sdxdxa56-design/jdjsjsh/zerohunter:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Run Agent
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          REPO: ${{ github.repository }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  # <--- تم إضافة المفتاح هنا
        run: python3 agent.py
