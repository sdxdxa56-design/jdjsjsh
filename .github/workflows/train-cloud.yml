name: ZeroHunter Code Quality & Dataset Sync

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requirements
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install requests huggingface_hub

      - name: Verify Python & Swarm Integrity + Build Dataset Index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "import ast, pathlib; [ast.parse(p.read_text(encoding='utf-8')) for p in pathlib.Path('.').rglob('*.py')]"
          python3 -m agents.swarm_orchestrator --verify || true
          python3 -c "from core.knowledge import build_curated_dataset; build_curated_dataset()"
          git config --global user.name "ZeroHunter Agent"
          git config --global user.email "agent@zerohunter.internal"
          git add datasets/ || true
          git diff --staged --quiet || git commit -m "chore: update analysis dataset index [skip ci]"
          git pull --rebase origin main || true
          git push || echo "No push needed"
