name: ZeroHunter Deep Cloud Trainer

on:
  workflow_dispatch:
    inputs:
      epochs:
        description: 'Training Epochs (default 3)'
        required: false
        default: '3'
        type: string

permissions:
  contents: write

jobs:
  cloud-train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Training Dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install transformers datasets accelerate huggingface_hub unsloth gguf protobuf sentencepiece

      - name: Run Deep Training & GGUF Export
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python3 -c "from core.knowledge import build_curated_dataset; build_curated_dataset()"
          python3 train.py || true

      - name: Upload and Publish GGUF Model to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -n "$HF_TOKEN" ]; then
            python3 upload_hf.py
          else
            echo "HF_TOKEN not set, skipping upload."
          fi
