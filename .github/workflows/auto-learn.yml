name: ZeroHunter Background Knowledge Sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests and huggingface_hub
        run: python3 -m pip install -q requests huggingface_hub

      - name: Cache Fast CPU Model for Instant Agent Replies
        id: hf-cache
        uses: actions/cache@v4
        with:
          path: .hf_cache
          key: hf-gguf-cpu-1.5b-v1

      - name: Pre-warm Fast CPU Model Cache
        if: steps.hf-cache.outputs.cache-hit != 'true'
        env:
          HF_HOME: ${{ github.workspace }}/.hf_cache
        run: |
          python3 -c "from huggingface_hub import hf_hub_download; hf_hub_download(repo_id='Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF', filename='qwen2.5-coder-1.5b-instruct-q4_k_m.gguf')"

      - name: Fetch latest public CVEs and Advisories into ChatML dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "from core.knowledge import build_curated_dataset; build_curated_dataset()"

      - name: Commit updated dataset
        run: |
          git config user.name "ZeroHunter Bot"
          git config user.email "actions@users.noreply.github.com"
          git add datasets/auto_curated.jsonl
          git diff --staged --quiet || git commit -m "Auto-curate latest security advisories into training dataset"
          git push
