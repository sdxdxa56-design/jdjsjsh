name: ZeroHunter Background Knowledge Sync

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  curate-knowledge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install requests
        run: python3 -m pip install -q requests

      - name: Cache Flat Fast CPU Model for Instant Agent Replies
        id: zh-cache
        uses: actions/cache@v4
        with:
          path: .zh_models
          key: zh-cpu-1.5b-flat-v1

      - name: Pre-warm Flat Fast CPU Model
        if: steps.zh-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .zh_models
          curl -fsSL --retry 3 -o .zh_models/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf "https://huggingface.co/Qwen/Qwen2.5-Coder-1.5B-Instruct-GGUF/resolve/main/qwen2.5-coder-1.5b-instruct-q4_k_m.gguf"

      - name: Fetch latest public CVEs and Advisories into ChatML dataset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -c "from core.knowledge import build_curated_dataset; build_curated_dataset()"

      - name: Commit updated dataset
        run: |
          git config user.name "ZeroHunter Bot"
          git config user.email "actions@users.noreply.github.com"
          git add datasets/auto_curated.jsonl
          git diff --staged --quiet || git commit -m "Auto-curate latest security advisories into training dataset"
          git pull --rebase origin main || true
          git push
