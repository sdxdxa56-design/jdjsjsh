<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZeroHunter Interactive</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 24px; }
    .wrap { max-width: 900px; margin: 0 auto; }
    .bar { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 12px 16px; margin-bottom: 12px; display: flex; justify-content: space-between; font-size: 14px; }
    #chat-box { height: 62vh; overflow-y: auto; border: 1px solid #334155; border-radius: 8px; padding: 16px; background: #1e293b; margin-bottom: 12px; }
    .msg { margin-bottom: 12px; padding: 12px; border-radius: 8px; white-space: pre-wrap; line-height: 1.6; }
    .user { background: #1d4ed8; margin-right: 15%; }
    .bot { background: #0f172a; border: 1px solid #334155; margin-left: 15%; }
    .input-area { display: flex; gap: 10px; }
    input { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: #fff; }
    button { padding: 12px 20px; border: none; border-radius: 8px; background: #16a34a; color: #fff; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div class="wrap">
    <h2>ZeroHunter — الوكيل الأمني التفاعلي</h2>
    <div class="bar">
      <span id="phase-text">الحالة: جاهز</span>
      <span id="eta-text">التقدم: 0%</span>
    </div>
    <div id="chat-box">
      <div class="msg bot">أرسل رابط مستودع أو هدف فحص، ويمكنك سؤالي أثناء التشغيل (مثلاً: أين وصلت وكم باقي لك؟).</div>
    </div>
    <div class="input-area">
      <input type="text" id="msg-input" placeholder="اكتب هدفك أو سؤالك للوكيل..." onkeypress="if(event.key==='Enter') sendMsg()">
      <button onclick="sendMsg()">إرسال</button>
    </div>
  </div>
  <script>
    let activeIssueId = null;
    let liveBotMsg = null;
    let pollTimer = null;

    function addMsg(text, cls) {
      const div = document.createElement('div');
      div.className = 'msg ' + cls;
      div.innerText = text;
      const box = document.getElementById('chat-box');
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
      return div;
    }

    async function sendMsg() {
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text) return;
      input.value = '';
      addMsg(text, 'user');

      if (activeIssueId) {
        await fetch('/api/reply/' + activeIssueId, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({message: text})
        });
        return;
      }

      liveBotMsg = addMsg('⏳ جاري بدء المهمة في GitHub Actions...', 'bot');
      const res = await fetch('/api/chat', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({message: text})
      });
      const data = await res.json();
      if (data.error) { liveBotMsg.innerText = '❌ ' + data.error; return; }
      activeIssueId = data.issue_id;
      pollTimer = setInterval(checkStatus, 3500);
    }

    async function checkStatus() {
      if (!activeIssueId) return;
      const res = await fetch('/api/status/' + activeIssueId);
      const data = await res.json();
      if (liveBotMsg) liveBotMsg.innerText = data.reply;
      if (data.progress) {
        document.getElementById('phase-text').innerText = 'المرحلة: ' + (data.progress.phase || '');
        document.getElementById('eta-text').innerText = 'التقدم: ' + (data.progress.progress || 0) + '% · المتبقي: ' + (data.progress.eta_seconds || 0) + 'ث';
      }
      if (data.status === 'done' || data.status === 'error') {
        clearInterval(pollTimer);
        activeIssueId = null;
      }
    }
  </script>
</body>
</html>
